<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이 돈이면 뭐 사지?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <div>
        <p class="eyebrow">랜덤 소비 뽑기 머신</p>
        <h1>이 돈이면 뭐 사지?</h1>
        <p class="subtitle">예산만 넣으면 그 금액 이하의 묘하게 탐나는 아이템을 하나 뽑아드려요.</p>
      </div>
      <div class="header-chip">🛒 MVP</div>
    </header>

    <main class="layout">
      <section class="main-panel" aria-label="랜덤 상품 추천">
        <form class="draw-form" id="drawForm">
          <label for="budgetInput">얼마까지 쓸까요?</label>
          <div class="budget-row">
            <input
              id="budgetInput"
              type="number"
              inputmode="numeric"
              min="0"
              step="100"
              placeholder="예: 30000"
              aria-describedby="budgetHint"
            >
            <button class="primary-btn" type="submit">🎰 랜덤템 뽑기</button>
          </div>
          <p id="budgetHint" class="hint">10,000 / 30,000 / 50,000 / 100,000원처럼 입력해보세요.</p>
        </form>

        <div class="quick-buttons" aria-label="빠른 금액 선택">
          <button type="button" data-budget="10000">1만원</button>
          <button type="button" data-budget="30000">3만원</button>
          <button type="button" data-budget="50000">5만원</button>
          <button type="button" data-budget="100000">10만원</button>
        </div>

        <p class="status-message" id="statusMessage" role="status"></p>

        <article class="product-card empty" id="productCard" aria-live="polite">
          <div class="empty-state">
            <div class="empty-icon">🎁</div>
            <h2>금액을 넣고 뽑기를 돌려보세요</h2>
            <p>오늘의 충동구매 후보가 여기에서 두둥 등장합니다.</p>
          </div>
        </article>
      </section>

      <aside class="side-panel" aria-label="최근 추천과 찜 목록">
        <details class="side-section recent-section" data-responsive-details>
          <summary>🕘 최근 추천 5개</summary>
          <div class="mini-list" id="recentList"></div>
        </details>

        <details class="side-section liked-section" data-responsive-details>
          <summary>💛 찜 목록</summary>
          <div class="mini-list" id="likedList"></div>
        </details>
      </aside>
    </main>

    <footer class="site-footer" aria-label="사이트 설명과 쿠팡 파트너스 고지">
      <p class="footer-description">이 돈이면 뭐 사지?는 입력한 금액 이하에서 랜덤으로 쇼핑 아이템을 추천하는 사이트입니다.</p>
      <p class="footer-disclosure">이 사이트는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받을 수 있습니다.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
